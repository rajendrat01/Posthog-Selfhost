# Merge with hobby compose. Uses EC2 instance role (no static keys, bucket stays private).
# Requires IMDS hop-limit 2 on i-04698d5860314ad21.

x-aws-s3: &aws-s3
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  OBJECT_STORAGE_ENABLED: "true"
  OBJECT_STORAGE_ENDPOINT: https://s3.ap-south-1.amazonaws.com
  OBJECT_STORAGE_PUBLIC_ENDPOINT: https://s3.ap-south-1.amazonaws.com
  OBJECT_STORAGE_BUCKET: nhai-posthog-storage-564088812664-ap-south-1-an
  OBJECT_STORAGE_REGION: ap-south-1
  OBJECT_STORAGE_ACCESS_KEY_ID: ""
  OBJECT_STORAGE_SECRET_ACCESS_KEY: ""
  OBJECT_STORAGE_FORCE_PATH_STYLE: "false"
  SESSION_RECORDING_V2_S3_ENDPOINT: https://s3.ap-south-1.amazonaws.com
  SESSION_RECORDING_V2_S3_BUCKET: nhai-posthog-storage-564088812664-ap-south-1-an
  SESSION_RECORDING_V2_S3_PREFIX: session-recordings/
  SESSION_RECORDING_V2_S3_REGION: ap-south-1
  SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ""
  SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ""
  SESSION_RECORDING_V2_S3_TIMEOUT_MS: "120000"

services:
  web:
    environment: *aws-s3
  worker:
    environment: *aws-s3
  plugins:
    environment: *aws-s3
  ingestion-sessionreplay:
    environment: *aws-s3
  recording-api:
    environment: *aws-s3
  capture:
    environment: *aws-s3
  replay-capture:
    environment: *aws-s3
  cymbal:
    environment: *aws-s3
  temporal-django-worker:
    environment: *aws-s3
